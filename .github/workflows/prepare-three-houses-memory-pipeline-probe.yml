name: Prepare Three Houses memory and pipeline probe branch
run-name: Prepare Three Houses memory and pipeline probe branch

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Create memory-pipeline probe branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@v4
        with:
          ref: XC-ios-ht
          path: workflow-tools
          fetch-depth: 1

      - name: Checkout serialized-shader source
        uses: actions/checkout@v4
        with:
          ref: three-houses-serialized-shaders
          path: source
          fetch-depth: 0

      - name: Add pipeline and memory diagnostics
        run: python3 workflow-tools/.github/scripts/prepare_three_houses_memory_pipeline_probe.py source

      - name: Verify diagnostic patch
        working-directory: source
        run: |
          set -euo pipefail
          grep -Fq 'using Ryujinx.Common.Logging;' src/Ryujinx.Graphics.Vulkan/PipelineBase.cs
          grep -Fq 'MemoryProbe' src/Ryujinx.Graphics.Vulkan/PipelineBase.cs
          grep -Fq 'PipelineProbe' src/Ryujinx.Graphics.Vulkan/PipelineBase.cs
          grep -Fq 'DescriptorProbe' src/Ryujinx.Graphics.Vulkan/PipelineBase.cs
          grep -Fq 'os_proc_available_memory' src/Ryujinx.Graphics.Vulkan/PipelineBase.cs
          grep -Fq 'native create begin' src/Ryujinx.Graphics.Vulkan/PipelineBase.cs
          git diff --check
          git diff -- src/Ryujinx.Graphics.Vulkan/PipelineBase.cs

      - name: Commit probe branch
        working-directory: source
        env:
          TARGET_BRANCH: three-houses-memory-pipeline-probe
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$TARGET_BRANCH"
          git add src/Ryujinx.Graphics.Vulkan/PipelineBase.cs
          git commit -m "Add iOS memory and Vulkan pipeline diagnostics"
          git push --force origin "$TARGET_BRANCH"

      - name: Write summary
        run: |
          {
            echo "## Three Houses memory-pipeline probe branch prepared"
            echo
            echo "- Branch: three-houses-memory-pipeline-probe"
            echo "- Base: three-houses-serialized-shaders"
            echo "- Adds: MemoryProbe, PipelineProbe, DescriptorProbe diagnostics"
            echo "- Does not disable push descriptors or alter pipeline behavior"
            echo
            echo "Next: build iOS custom MoltenVK IPA v2 on this branch, then repack increased memory."
          } >> "$GITHUB_STEP_SUMMARY"
