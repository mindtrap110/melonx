name: iOS unsigned IPA
run-name: iOS unsigned IPA (${{ github.ref_name }})

on:
  workflow_dispatch:
  push:
    branches:
      - XC-ios-ht
      - main
      - master
    paths:
      - ".github/workflows/ios-unsigned-ipa.yml"
      - "Directory.Packages.props"
      - "global.json"
      - "nuget.config"
      - "src/**"
      - "distribution/ios/**"

permissions:
  contents: read

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_PROJECT: src/MeloNX/MeloNX.xcodeproj
  XCODE_SCHEME: MeloNX
  XCODE_CONFIGURATION: Release
  DERIVED_DATA_PATH: build/DerivedData
  IPA_OUTPUT_DIR: build/ipa
  RESULT_BUNDLE_PATH: build/MeloNX.xcresult

jobs:
  build:
    name: Build cbpool4 active16 IPA with memory entitlement
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Start timer
        id: timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode
        run: |
          set -euo pipefail
          selected_xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' -print | sort -V | tail -n 1)"
          if [ -z "$selected_xcode" ]; then
            echo "No Xcode installation found" >&2
            exit 1
          fi
          sudo xcode-select -s "$selected_xcode/Contents/Developer"
          echo "Selected Xcode: $selected_xcode"
          xcodebuild -version

      - name: Verify cbpool4 active16 and memory entitlement
        run: |
          set -euo pipefail
          app_source="$PWD/src/MeloNX/MeloNX/App/UI/MeloNXApp.swift"
          pool_source="$PWD/src/Ryujinx.Graphics.Vulkan/CommandBufferPool.cs"
          source_entitlements="$PWD/src/MeloNX/MeloNX/MeloNX.entitlements"

          grep -Fq 'public const int MaxCommandBuffers = 4;' "$pool_source"
          grep -Fq 'MVK_CONFIG_MAX_ACTIVE_METAL_COMMAND_BUFFERS_PER_QUEUE", value: "16"' "$app_source"
          grep -Fq 'MVK_CONFIG_PREFILL_METAL_COMMAND_BUFFERS", value: "2"' "$app_source"
          grep -Fq 'MVK_CONFIG_USE_COMMAND_POOLING", value: "0"' "$app_source"
          grep -Fq 'MVK_CONFIG_SYNCHRONOUS_QUEUE_SUBMITS", value: "1"' "$app_source"
          grep -Fq 'CommandBufferUsageFlags.OneTimeSubmitBit' "$pool_source"

          value="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.kernel.increased-memory-limit' "$source_entitlements")"
          test "$value" = "true"

          echo "Ryujinx command buffers per main pool: 4"
          echo "MoltenVK active Metal command buffers per queue: 16"
          echo "Source Increased Memory Limit entitlement: $value"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'nuget.config', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET iOS workload
        run: dotnet workload install ios

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -resolvePackageDependencies

      - name: Build unsigned app
        run: |
          set -euo pipefail
          libdeps="$PWD/build/libdeps"
          mkdir -p build
          ln -sfn "$PWD/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries" "$libdeps"
          rm -rf "$RESULT_BUNDLE_PATH"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration "$XCODE_CONFIGURATION" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            "LIBRARY_SEARCH_PATHS=\$(inherited) $libdeps" \
            "OTHER_LDFLAGS=\$(inherited) $libdeps/Ryujinx.Headless.SDL2.dylib"

      - name: Collect Xcode diagnostics
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics
          if [ -d "$RESULT_BUNDLE_PATH" ]; then
            xcrun xcresulttool get --path "$RESULT_BUNDLE_PATH" --format json --legacy > build/diagnostics/xcresult.json || true
          fi
          if [ -d "$DERIVED_DATA_PATH/Logs" ]; then
            ditto "$DERIVED_DATA_PATH/Logs" build/diagnostics/Logs
          fi

      - name: Upload Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-cbpool4-active16-xcode-diagnostics
          path: |
            ${{ env.RESULT_BUNDLE_PATH }}
            build/diagnostics
          if-no-files-found: warn

      - name: Package IPA with main-executable memory entitlement
        run: |
          set -euo pipefail
          app_path="$(find "$DERIVED_DATA_PATH/Build/Products/${XCODE_CONFIGURATION}-iphoneos" -maxdepth 1 -name 'MeloNX.app' -type d -print -quit)"
          if [ -z "$app_path" ]; then
            echo "MeloNX.app was not produced" >&2
            exit 1
          fi

          ryujinx_dylib="$PWD/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/Ryujinx.Headless.SDL2.dylib"
          if [ ! -f "$ryujinx_dylib" ]; then
            ryujinx_dylib="$(find "$PWD/src/Ryujinx.Headless.SDL2" "$PWD/src/MeloNX/MeloNX/Dependencies" -name 'Ryujinx.Headless.SDL2.dylib' -type f -print -quit)"
          fi
          if [ -z "$ryujinx_dylib" ] || [ ! -f "$ryujinx_dylib" ]; then
            echo "Ryujinx.Headless.SDL2.dylib was not produced" >&2
            exit 1
          fi

          mkdir -p "$app_path/Frameworks"
          ditto "$ryujinx_dylib" "$app_path/Frameworks/Ryujinx.Headless.SDL2.dylib"
          chmod 755 "$app_path/Frameworks/Ryujinx.Headless.SDL2.dylib"
          embedded_ryujinx="$app_path/Frameworks/Ryujinx.Headless.SDL2.dylib"
          test -f "$embedded_ryujinx"
          ryujinx_hash_before="$(shasum -a 256 "$embedded_ryujinx" | awk '{print $1}')"

          rm -rf "$IPA_OUTPUT_DIR"
          mkdir -p "$IPA_OUTPUT_DIR/Payload"

          signing_entitlements="$IPA_OUTPUT_DIR/MeloNX-signing-entitlements.plist"
          cat > "$signing_entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.kernel.increased-memory-limit</key>
            <true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$signing_entitlements"

          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")"
          main_executable="$app_path/$executable_name"
          test -f "$main_executable"

          codesign --remove-signature "$main_executable" 2>/dev/null || true
          codesign \
            --force \
            --sign - \
            --timestamp=none \
            --generate-entitlement-der \
            --entitlements "$signing_entitlements" \
            "$main_executable"

          embedded_entitlements="$IPA_OUTPUT_DIR/MeloNX-main-executable-entitlements.plist"
          codesign -d --entitlements :- "$main_executable" > "$embedded_entitlements" 2>/dev/null
          plutil -lint "$embedded_entitlements"
          embedded_value="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.kernel.increased-memory-limit' "$embedded_entitlements")"
          test "$embedded_value" = "true"
          echo "Main executable Increased Memory Limit entitlement: $embedded_value"

          ryujinx_hash_after="$(shasum -a 256 "$embedded_ryujinx" | awk '{print $1}')"
          test "$ryujinx_hash_before" = "$ryujinx_hash_after"
          echo "Nested Ryujinx dylib unchanged: $ryujinx_hash_after"

          ditto "$app_path" "$IPA_OUTPUT_DIR/Payload/MeloNX.app"
          test -f "$IPA_OUTPUT_DIR/Payload/MeloNX.app/Frameworks/Ryujinx.Headless.SDL2.dylib"
          payload_executable="$IPA_OUTPUT_DIR/Payload/MeloNX.app/$executable_name"
          codesign -d --entitlements :- "$payload_executable" > /tmp/payload-main-entitlements.plist 2>/dev/null
          payload_value="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.kernel.increased-memory-limit' /tmp/payload-main-entitlements.plist)"
          test "$payload_value" = "true"

          (cd "$IPA_OUTPUT_DIR" && zip -qry MeloNX-unsigned.ipa Payload)
          shasum -a 256 "$IPA_OUTPUT_DIR/MeloNX-unsigned.ipa"
          du -sh "$IPA_OUTPUT_DIR/MeloNX-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-unsigned-ipa-cbpool4-active16-memory-main-executable
          path: |
            ${{ env.IPA_OUTPUT_DIR }}/MeloNX-unsigned.ipa
            ${{ env.IPA_OUTPUT_DIR }}/MeloNX-signing-entitlements.plist
            ${{ env.IPA_OUTPUT_DIR }}/MeloNX-main-executable-entitlements.plist
          if-no-files-found: error

      - name: Report duration
        if: always()
        run: |
          finished_at="$(date +%s)"
          elapsed="$((finished_at - ${{ steps.timer.outputs.started_at }}))"
          {
            echo "## iOS cbpool4 active16 IPA with memory entitlement"
            echo
            echo "- Ryujinx command buffers per main pool: 4"
            echo "- MoltenVK active Metal command buffers per queue: 16"
            echo "- Main executable entitlement: verified"
            echo "- Nested Ryujinx dylib: unchanged"
            echo "- Elapsed seconds: $elapsed"
            echo "- Elapsed minutes: $((elapsed / 60))m $((elapsed % 60))s"
            echo "- Runner: $RUNNER_OS / $RUNNER_ARCH"
          } >> "$GITHUB_STEP_SUMMARY"
